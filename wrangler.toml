#:schema node_modules/wrangler/config-schema.json
name = "aso-mcp-skills"
main = "src/worker.py"
compatibility_date = "2024-12-06"
compatibility_flags = ["python_workers"]

# Set OPENAI_APPS_CHALLENGE in the worker environment to the exact public
# domain-verification token supplied by the OpenAI submission portal.
# ChatGPT OAuth discovery uses https://www.appkittie.com; deploy the frontend
# account-linking routes before connecting https://mcp.appkittie.com/chatgpt/mcp.

[observability]
enabled = true
